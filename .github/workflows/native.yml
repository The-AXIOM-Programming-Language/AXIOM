name: Native AXIOM

on:
  push:
    paths:
      - "native/**"
      - "examples/**"
      - ".github/workflows/native.yml"
  pull_request:
    paths:
      - "native/**"
      - "examples/**"
      - ".github/workflows/native.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run native compiler tests
        working-directory: native
        run: cargo test --locked
      - name: Build release executable
        working-directory: native
        run: cargo build --release --locked
      - name: Exercise CLI and original neuroscience examples
        working-directory: native
        run: |
          cargo run --locked -- --version
          cargo run --locked -- --help
          cargo run --locked -- check examples/hello.ax
          cargo run --locked -- run examples/hello.ax
          cargo run --locked -- check ../examples/first_neuron.ax
          cargo run --locked -- run ../examples/first_neuron.ax
          cargo run --locked -- check ../examples/pulse_train_neuron.ax
          cargo run --locked -- run ../examples/pulse_train_neuron.ax
